# Access control for the broker (mosquitto.conf), read when it starts (Restart on its tile).

# Anonymous clients: only the browser WebSocket listener (/mqtt/ws) accepts them. Read-only.
topic read alerts/#
topic read status/#
topic read devices/#
topic read registry/#
topic read $SYS/#

# Every logged-in client (services, Pis, NodeMCUs...), by its username (%u). A new device needs
# only a login (node serve.mjs mqtt-user <name>), no lines here:
#   reads all alerts, device data and the hub's registry, announces itself on status/<name>,
#   publishes its own data under devices/<name>/... and its own alerts under alerts/<name>/...
# (Mosquitto warns that the read patterns contain no %u: intended, they apply to every login.)
pattern read alerts/#
pattern read devices/#
pattern read status/#
pattern read registry/#
pattern readwrite status/%u
pattern readwrite devices/%u/#
pattern readwrite alerts/%u/#
# Commands for a device (e.g. cmd/pi3b-1/identify), sent by the hub: each device reads only its own.
pattern read cmd/%u/#

# The hub (../serve.mjs): publishes what it knows about the devices, e.g. registry/pis/<name>
# (subtitle, SSH host) from the Raspberry Pis page, and sends them commands (cmd/<name>/<command>).
user hub
topic readwrite registry/#
topic readwrite cmd/#

# For testing and debugging with mosquitto_pub / mosquitto_sub; the hub also uses it to clear a
# removed device's retained topics.
user admin
topic readwrite #
