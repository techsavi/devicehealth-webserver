# Mosquitto MQTT broker for the local services, run by ../serve.mjs (services.json "mqtt")
# with this folder as its working directory, so relative paths start here.
#
# Topics (README "MQTT"):
#   alerts/<source>/<id>   retained JSON per active alert; an empty retained message clears it
#   status/<client>        "online", or "offline" (set by the broker as the client's last will)
#
# Who may do what is in acl.conf. Users and passwords: node serve.mjs mqtt-user <name>.

# Every client logs in with a user from the password file, except on the browser listener below.
allow_anonymous false
password_file ../.run/mqtt/passwd
acl_file acl.conf

# MQTT over TCP for services on this PC and devices on the LAN and tailnet (Pis, NodeMCUs...).
# Every client logs in; Windows Firewall admits TCP 1883 from the local subnet and the tailnet
# only (README "MQTT"). Unencrypted: fine on a home LAN, but don't forward this port.
listener 1883

# MQTT over WebSockets for browsers: Caddy forwards /mqtt/ws here (LAN and tailnet only).
# Anonymous, and read-only by acl.conf.
listener 9001 127.0.0.1
protocol websockets
listener_allow_anonymous true

# Retained messages (the current alerts, the hub's registry) survive broker restarts. They are
# saved after every change, not on a timer: the supervisor stops the broker with a hard kill
# (and restarts it whenever a login is added), so anything unsaved would be lost.
persistence true
persistence_location ../.run/mqtt/
autosave_on_changes true
autosave_interval 1

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
